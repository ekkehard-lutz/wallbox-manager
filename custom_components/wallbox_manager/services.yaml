step_power:
  name: Step NETZ requested power
  description: Move one legal nominal-power step in the current NETZ draft. Does not approve or start charging. Supply the current power entity's draft revision and runtime incarnation.
  target:
    entity:
      integration: wallbox_manager
      domain: number
  fields:
    direction:
      name: Direction
      required: true
      selector:
        number:
          min: -1
          max: 1
          step: 2
          mode: box
    revision:
      name: Expected draft revision
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box
    incarnation:
      name: Runtime incarnation
      required: true
      selector:
        text:
edit_timing:
  name: Edit NETZ timing
  description: Coordinate both timing editors with current timing revision and runtime incarnation. Begin holds drafts while editing; end starts the 15-second window; update changes only the targeted timing draft.
  target:
    entity:
      integration: wallbox_manager
      domain: text
  fields:
    action:
      name: Editing action
      required: true
      selector:
        select:
          options:
            - begin
            - update
            - end
    owner:
      name: Editor identity
      required: true
      selector:
        text:
    revision:
      name: Expected timing revision
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box
    incarnation:
      name: Runtime incarnation
      required: true
      selector:
        text:
    value:
      name: New draft time
      selector:
        text:
